<template name="sChatBox">
  <div class="chat-box">
    <div class="chat-header">
      <h3>Messagerie</h3>
    </div>
    <div class="chat-content">
      <div class="chat-messages" id="mess-area">
        {{#each messages}}
          {{#if msgSide from}}
            <div class="message left">
              <img src="{{getIm from}}" class="customer_photo" alt="Photo de profil">
              <div class="message-content">
                <strong>{{name}}:</strong>
                <p>{{message}}</p>
              </div>
            </div>
          {{else}}
            <div class="message right">
              <div class="message-content">
                <strong>{{name}}:</strong>
                <p>{{message}}</p>
              </div>
              <img src="{{getIm from}}" class="customer_photo" alt="Photo de profil">
            </div>
          {{/if}}
        {{/each}}
      </div>
      <div class="chat-input">
        <input type="text" id="message" placeholder="Tapez votre message...">
        <button id="send">Envoyer</button>
      </div>
    </div>
  </div>
</template>
