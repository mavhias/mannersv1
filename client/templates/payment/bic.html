<template name="bic1">

  <style>
    #bicl {
      width: 100%;
      height: 100%;
    }
  </style>

  <a class="btn btn-primary" id="modal-bic-l" data-toggle="modal">Bic upl</a>
  <div class="modal fade" id="modal-bic">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
          <h4 class="modal-title">Modal title</h4>
        </div>
        <div class="modal-body">
          <section>


            <form id="bicl" role="form">
              <legend>Fill this fields please</legend>

              <div class="form-group">
                <div class="inline-block statistics_designation red_text">
                  Email:
                </div> <input type="email" name="email" class="form-control" id="" placeholder="enter host email">
              </div>

              <div class="statistics_block">
                <div class="inline-block statistics_designation red_text">
                  IBAN:
                </div>
                <input type="text" name="iban" id="iban" class="form-control" value="" required="required" title="">
              </div>
              <div class="statistics_block">
                <div class="inline-block statistics_designation red_text">
                  BIC:
                </div>
                <input type="text" name="bic" class="form-control" value="" required="required" placeholder="example: AAAA BB DDD"
                  pattern="^[a-zA-Z]{6}\w{2}(\w{3})?$" title="">
                <div class="inline-block statistics_designation red_text">
                  CNI:
                </div>
                <input type="file" id="cnifile" required name="fileselect[]" multiple="multiple" />
                <div class="inline-block statistics_designation red_text">
                  PNG:
                </div>
                <input type="file" id="pngfile" required name="fileselect[]" multiple="multiple" />
              </div>

              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </section>
        </div>
        <div class="modal-footer">
       
        </div>
      </div>
    </div>
  </div>
</template>
